name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: 'Version suffix (e.g., "preview.1", "rc.1"). Leave empty for stable release.'
        required: false
        type: string
      push-to-nuget:
        description: 'Push packages to NuGet.org'
        required: true
        type: boolean
        default: false
      dry-run:
        description: 'Dry run — pack but do not push'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publish runs: never cancel an in-flight publish (a half-pushed package set is
# worse than a queued run), but make sure two dispatches cannot race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Restore
        run: dotnet restore src/IntegratedS3/IntegratedS3.slnx

      - name: Build
        run: dotnet build src/IntegratedS3/IntegratedS3.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/IntegratedS3/IntegratedS3.slnx --no-build --configuration Release --verbosity normal

      - name: AOT Validation
        run: pwsh -File eng/Invoke-AotPublishValidation.ps1

  pack-and-publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: validate
    # contents: write is required to push the release tag and create the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Determine version
        id: version
        run: |
          VERSION_PREFIX=$(sed -n 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/p' src/IntegratedS3/Directory.Build.props | head -n 1)
          if [ -z "$VERSION_PREFIX" ]; then
            echo "::error title=Missing VersionPrefix::Could not read <VersionPrefix> from src/IntegratedS3/Directory.Build.props."
            exit 1
          fi
          VERSION_SUFFIX="${{ inputs.version-suffix }}"
          if [ -n "$VERSION_SUFFIX" ]; then
            echo "pack-args=--version-suffix $VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "version=$VERSION_PREFIX-$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "version-label=prerelease ($VERSION_SUFFIX)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "pack-args=" >> $GITHUB_OUTPUT
            echo "version=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version-label=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack
        run: |
          dotnet pack src/IntegratedS3/IntegratedS3.slnx \
            --configuration Release \
            --output ./artifacts/packages \
            ${{ steps.version.outputs.pack-args }}

      - name: List packages
        run: ls -la ./artifacts/packages/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages
          retention-days: 90

      - name: Validate NuGet API key
        if: inputs.push-to-nuget == true && inputs.dry-run == false
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY//[[:space:]]/}" ]; then
            echo "::error title=Missing NUGET_API_KEY::Repository secret NUGET_API_KEY is required when push-to-nuget is true and dry-run is false. Add the repository secret in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Push to NuGet.org
        if: inputs.push-to-nuget == true && inputs.dry-run == false
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # Make the published package set traceable to source: tag the exact commit that was
      # packed and pushed. Re-runs of an already-tagged commit are tolerated; publishing a
      # version whose tag points at a different commit fails loudly.
      - name: Tag release commit
        if: inputs.push-to-nuget == true && inputs.dry-run == false
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            EXISTING_SHA=$(git rev-parse "$TAG^{commit}")
            if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points at $GITHUB_SHA; skipping tag creation."
              exit 0
            fi
            echo "::error title=Tag conflict::Tag $TAG already exists at $EXISTING_SHA but this run published $GITHUB_SHA. Bump VersionPrefix in src/IntegratedS3/Directory.Build.props before publishing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "IntegratedS3 $TAG" "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: inputs.push-to-nuget == true && inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping release creation."
            exit 0
          fi
          RELEASE_ARGS=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "IntegratedS3 $TAG" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          ASSETS=()
          for asset in ./artifacts/packages/*.nupkg ./artifacts/packages/*.snupkg; do
            if [ -e "$asset" ]; then
              ASSETS+=("$asset")
            fi
          done
          gh release create "$TAG" "${RELEASE_ARGS[@]}" "${ASSETS[@]}"

      - name: Publish summary
        run: |
          echo "## NuGet Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }} (${{ steps.version.outputs.version-label }})" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Push to NuGet:** ${{ inputs.push-to-nuget }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push-to-nuget }}" = "true" ] && [ "${{ inputs.dry-run }}" = "false" ]; then
            echo "**Tag / Release:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Tag / Release:** skipped (dry run or push disabled)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls ./artifacts/packages/*.nupkg | xargs -I {} basename {} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
