name: CI

# Free-tier strategy: the automatic gate does only fast, deterministic, offline correctness checks
# (restore/build + unit/integration tests + the fast E2E smoke subset). Heavier work — the full E2E
# suite, AOT publish validation, coverage, and multi-OS runs — is opt-in via workflow_dispatch. Perf
# benchmarks are NEVER run on GitHub-hosted runners (no CPU isolation → noise); run them locally with
# scripts/bench.sh, or on a self-hosted runner (see benchmarks/baseline/README.md).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run-heavy:
        description: 'Run the heavy suite (full E2E + AOT + coverage, ubuntu + windows).'
        type: boolean
        default: false
      run-benchmarks:
        description: 'Run BenchmarkDotNet + regression gate. Requires a self-hosted runner labelled "benchmarks".'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  # ── FREE-TIER GATE (automatic on push/PR) ─────────────────────────────────
  # restore + build + unit/integration tests + fast E2E smoke. All offline & deterministic.
  build-test-smoke:
    name: Build, Unit & E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Restore
        run: dotnet restore src/IntegratedS3/IntegratedS3.slnx

      - name: Build
        run: dotnet build src/IntegratedS3/IntegratedS3.slnx --no-restore --configuration Release

      - name: Unit & integration tests
        run: >-
          dotnet test src/IntegratedS3/IntegratedS3.Tests/IntegratedS3.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx" --results-directory ./artifacts/test-results

      - name: E2E smoke (offline, Disk provider)
        run: >-
          dotnet test src/IntegratedS3/IntegratedS3.E2E.Tests/IntegratedS3.E2E.Tests.csproj
          --no-build --configuration Release --filter "Suite=Smoke"
          --logger "trx;LogFileName=e2e-smoke.trx" --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./artifacts/test-results/**/*.trx
          retention-days: 7

  # ── OPT-IN HEAVY SUITE (workflow_dispatch only) ───────────────────────────
  # Full E2E (Smoke + Full), AOT publish validation, coverage, across ubuntu + windows.
  # Offline, so it can run on hosted runners — but it is opt-in to keep the free tier lean.
  heavy:
    name: Heavy Suite (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.run-heavy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Restore
        run: dotnet restore src/IntegratedS3/IntegratedS3.slnx

      - name: Build
        run: dotnet build src/IntegratedS3/IntegratedS3.slnx --no-restore --configuration Release

      - name: Full test suite (incl. E2E Full) + coverage
        run: >-
          dotnet test src/IntegratedS3/IntegratedS3.slnx
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=full.trx" --results-directory ./artifacts/test-results

      - name: Validate AOT publish
        run: pwsh -File eng/Invoke-AotPublishValidation.ps1

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: heavy-results-${{ matrix.os }}
          path: ./artifacts/test-results/**/*
          retention-days: 14

  # ── OPT-IN BENCHMARKS (self-hosted only) ──────────────────────────────────
  # BenchmarkDotNet needs CPU isolation that GitHub-hosted runners do not provide. This job only runs
  # when explicitly requested AND a self-hosted runner labelled "benchmarks" is registered; otherwise it
  # simply does not start. To wire one up, register a self-hosted runner on a quiet machine with labels
  # [self-hosted, benchmarks] (Settings → Actions → Runners), commit a baseline generated on that box
  # (scripts/bench.sh + scripts/bench-compare.sh --update-baseline), then dispatch with run-benchmarks=true.
  benchmarks:
    name: Benchmarks + regression gate (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.run-benchmarks
    runs-on: [ self-hosted, benchmarks ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run benchmarks
        run: bash scripts/bench.sh '*'
      - name: Regression gate vs committed baseline
        run: bash scripts/bench-compare.sh
