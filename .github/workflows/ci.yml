name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Restore
        run: dotnet restore src/IntegratedS3/IntegratedS3.slnx

      - name: Build
        run: dotnet build src/IntegratedS3/IntegratedS3.slnx --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test src/IntegratedS3/IntegratedS3.slnx
          --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/test-results/**/*.trx
          retention-days: 7

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline"
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: |
            ./artifacts/coverage-report
            ./artifacts/test-results/**/coverage.cobertura.xml
          retention-days: 30

  aot-validation:
    name: AOT Publish Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Validate AOT Publish
        run: pwsh -File eng/Invoke-AotPublishValidation.ps1

  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs: [build-and-test, aot-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/IntegratedS3/Directory.Packages.props

      - name: Pack
        run: dotnet pack src/IntegratedS3/IntegratedS3.slnx --configuration Release --output ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/packages
          retention-days: 30
