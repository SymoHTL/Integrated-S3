version: 2
updates:
  # NuGet packages — central package management lives in src/IntegratedS3/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /src/IntegratedS3
    schedule:
      interval: weekly
    groups:
      # One grouped PR for all minor/patch bumps; majors stay individual PRs.
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
